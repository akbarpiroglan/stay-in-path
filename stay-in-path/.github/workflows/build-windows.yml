name: Build Windows app
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Package Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name StayInPath --icon assets/stay-in-path.ico --add-data "assets;assets" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: StayInPath-Windows
          path: dist/StayInPath.exe
